name: Aggiorna CSV Prezzo alle 8

on:
  schedule:
    - cron: '5 */3 * * *' # Scatta alle 00:05, 03:05, 06:05, 09:05, ecc. (UTC) al minuto 5 di ogni 3 ore 
  workflow_dispatch: # permette anche di avviarlo manualmente

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Scarica CSV dal MIMIT (prezzo_alle_8.csv)
      run: |
        mkdir -p ./public/data
        curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
         -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8" \
         -H "Accept-Language: it-IT,it;q=0.9,en-US;q=0.8,en;q=0.7" \
         --connect-timeout 15 --max-time 30 -L --retry 3 \
         https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv -o ./public/data/prezzo_alle_8.csv
    - name: Rimuovi caratteri 
      run: |
        sed -i 's/"//g' ./public/data/prezzo_alle_8.csv
        sed -i 's/://g' ./public/data/prezzo_alle_8.csv
    - name: Commit e push se cambiato
      run: |
        git pull
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add ./public/data/prezzo_alle_8.csv
        git diff --staged --quiet || git commit -m "Aggiornamento automatico prezzo_alle_8.csv $(date)"
        git push
